<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8px; }
      .card-success { fill: #064e3b; stroke: #059669; stroke-width: 1.5; rx: 8px; }
      .card-fail { fill: #4c0519; stroke: #e11d48; stroke-width: 1.5; rx: 8px; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; text-anchor: middle; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; text-anchor: middle; }
      .text-win { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #34d399; text-anchor: middle; }
      .text-lose { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #fb7185; text-anchor: middle; }
      .arrow { stroke: #60a5fa; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="10" />

  <!-- 1단계 -->
  <rect x="80" y="25" width="600" height="56" class="card" />
  <text x="380" y="48" class="text-title">1. 사용자 A (선행 요청) : DB 행 락 점유</text>
  <text x="380" y="67" class="text-sub">SELECT * FROM seats WHERE id = 1 FOR UPDATE 구문으로 대상 좌석 배타 잠금 획득</text>

  <path d="M 380 81 L 380 105" class="arrow" />

  <!-- 2단계 -->
  <rect x="80" y="105" width="600" height="56" class="card" />
  <text x="380" y="128" class="text-title">2. 사용자 B (후행 요청) : 트랜잭션 대기 (Blocking)</text>
  <text x="380" y="147" class="text-sub">동일 좌석의 행 락이 걸려 있으므로 사용자 A의 트랜잭션 종료 시까지 DB 커넥션을 쥐고 대기</text>

  <path d="M 380 161 L 380 185" class="arrow" />

  <!-- 3단계 -->
  <rect x="80" y="185" width="600" height="56" class="card-success" />
  <text x="380" y="208" class="text-win">3. 사용자 A : 주문 및 결제 완료 (200 OK)</text>
  <text x="380" y="227" class="text-sub" fill="#a7f3d0">좌석 상태를 SOLD로 확정하고 트랜잭션 커밋 완료 → Row Lock 자동 해제</text>

  <path d="M 380 241 L 380 265" class="arrow" />

  <!-- 4단계 -->
  <rect x="80" y="265" width="600" height="66" class="card-fail" />
  <text x="380" y="289" class="text-lose">4. 사용자 B : 락 획득 후 좌석 상태 검증 실패 (400 Bad Request)</text>
  <text x="380" y="308" class="text-sub" fill="#fecdd3">대기 풀리며 좌석 조회 → 이미 'SOLD' 상태이므로 IllegalStateException 발생</text>
  <text x="380" y="324" class="text-sub" fill="#fecdd3">👉 롤백 처리 후 안전하게 차단: "이미 선점되었거나 판매 완료된 좌석입니다"</text>
</svg>
